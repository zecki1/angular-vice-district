<div class="shell-container">
  <aside class="sidebar" [class.open]="isSidebarOpen()" [class.mobile]="isMobile()" aria-label="Navegação principal">
    <div class="sidebar-header">
      <a routerLink="/" class="logo" (click)="closeSidebar()">
        <span class="logo-icon">🎮</span>
        <span class="logo-text">GameHub</span>
      </a>
      <button class="sidebar-toggle" (click)="toggleSidebar()" [attr.aria-expanded]="isSidebarOpen()" aria-label="Alternar menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          @if (!isSidebarOpen() || isMobile()) {
            <path d="M3 12h18M3 6h18M3 18h18" stroke-linecap="round" stroke-linejoin="round"/>
          } @else {
            <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
          }
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav" aria-label="Menu de navegação">
      <ul>
        @for (item of navItems; track item.route) {
          <li>
            <a
              [routerLink]="item.route"
              routerLinkActive="active"
              class="nav-link"
              (click)="closeSidebar()"
              [attr.aria-current]="currentRoute() === item.route || (item.route !== '/' && currentRoute().startsWith(item.route)) ? 'page' : null"
            >
              <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
              <span class="nav-label">{{ item.label }}</span>
              @if (item.badge) {
                <span class="nav-badge">{{ item.badge }}</span>
              }
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">GH</div>
        <div class="user-details">
          <span class="user-name">Player One</span>
          <span class="user-rank">Level 10</span>
        </div>
      </div>
    </div>
  </aside>

  <div class="main-wrapper">
    @if (isMobile()) {
    <header class="top-bar">
      <button class="menu-btn" (click)="toggleSidebar()" aria-label="Abrir menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12h18M3 6h18M3 18h18" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="top-bar-title">GameHub</div>
      <div class="top-bar-actions">
        <button class="icon-btn" title="Buscar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
          </svg>
        </button>
        <button class="icon-btn" title="Notificações">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>
      </div>
    </header>
  }

  <main class="main-content" id="main-content">
    <router-outlet />
  </main>
</div>

  @if (isMobile() && isSidebarOpen()) {
    <div class="sidebar-overlay" (click)="closeSidebar()" aria-hidden="true"></div>
  }

  <a href="#main-content" class="skip-link">Pular para o conteúdo</a>
</div>
