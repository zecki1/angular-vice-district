# Pipeline de qualidade — implementado em português brasileiro
# Fluxo: lint -> build -> unit (Karma) -> e2e (Playwright) -> Lighthouse CI
# Gate de PR: só merge de código que passa em tudo (ração §0.1/§3 do planejamento).

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar-projeto:
    name: Verificar se o app já foi criado
    runs-on: ubuntu-latest
    outputs:
      existe: ${{ steps.check.outputs.existe }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f package.json ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

  qualidade:
    name: Lint -> Build -> Unit -> E2E
    needs: verificar-projeto
    if: needs.verificar-projeto.outputs.existe == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint --if-present
      - name: Typecheck (tsc)
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Build de produção
        run: npm run build
      - name: Testes unitários (Karma)
        run: npm run test:ci --if-present
      - name: Salvar relatório de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-lcov
          path: coverage/
          retention-days: 14
      - name: Testes E2E (Playwright)
        env:
          E2E_BASE_URL: http://localhost:4173
        run: |
          npx serve dist/vice-district/browser -l 4173 &
          sleep 2
          npm run e2e:ci
          status=$?
          kill %1 2>/dev/null
          exit $status
      - name: Salvar relatório do Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  analise-bundle:
    name: Análise de bundle (regressão de tamanho)
    needs: [verificar-projeto, qualidade]
    if: needs.verificar-projeto.outputs.existe == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Gerar mapa do bundle (source-map-explorer)
        run: npm run analyze --if-present
      - name: Salvar relatório de bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: bundle-analysis/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI (Performance/SEO/A11y ≥ 90)
    needs: [verificar-projeto, qualidade]
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pulado — auditoria reativada na última semana do roadmap
        run: echo "Lighthouse adiado para a semana final"
